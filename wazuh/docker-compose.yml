# Wazuh single-node stack for the home lab (WAZUH01, 10.10.10.50).
#
# This is a trimmed single-node deployment based on the official wazuh-docker
# single-node compose (https://github.com/wazuh/wazuh-docker). It runs three
# services: the indexer (OpenSearch), the manager, and the dashboard.
#
# Reviewer note: I pin an explicit image version for reproducibility and read every
# credential from a .env file that is GITIGNORED - no secrets in the repo.
#
# Before first run:
#   1) cp .env.example .env   and edit the passwords in .env
#   2) run ./generate-certs.sh (wraps the official cert tool) to create indexer certs
#   3) sudo sysctl -w vm.max_map_count=262144   (OpenSearch requirement)
#   4) docker compose up -d

name: wazuh-lab

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"   # keep heap small for a 6 GB VM
      - "bootstrap.memory_lock=true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - indexer-data:/var/lib/wazuh-indexer
      - ./config/certs:/usr/share/wazuh-indexer/certs:ro

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    hostname: wazuh.manager
    restart: always
    depends_on:
      - wazuh.indexer
    ports:
      - "1514:1514"     # agent event traffic
      - "1515:1515"     # agent enrollment
      - "514:514/udp"   # syslog
      - "55000:55000"   # manager API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - manager-config:/var/ossec/etc
      - manager-logs:/var/ossec/logs
      - ./config/certs:/etc/ssl/certs/wazuh:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    hostname: wazuh.dashboard
    restart: always
    depends_on:
      - wazuh.indexer
    ports:
      - "5601:5601"     # dashboard UI: https://10.10.10.50:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    volumes:
      - ./config/certs:/usr/share/wazuh-dashboard/certs:ro

volumes:
  indexer-data:
  manager-config:
  manager-logs:
